name: Deploy Page to page branch

on:
  push:
    branches: [master]
    paths:
      - 'Page/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare page branch worktree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin page
          git worktree add ../page-branch origin/page

      - name: Sync Page/ into page branch worktree
        run: |
          find ../page-branch -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r Page/. ../page-branch/
          mv "../page-branch/Project L.html" "../page-branch/index.html"

      - name: Commit and push
        run: |
          cd ../page-branch
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy: sync Page/ from ${{ github.sha }}"
          git push origin HEAD:page
