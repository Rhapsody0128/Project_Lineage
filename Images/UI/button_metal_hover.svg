<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96">
  <defs>
    <linearGradient id="metalFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7bcc1"/>
      <stop offset="0.5" stop-color="#888d92"/>
      <stop offset="1" stop-color="#54575b"/>
    </linearGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="0.5" stop-color="#e0a85a"/>
      <stop offset="1" stop-color="#7a4d16"/>
    </radialGradient>
    <clipPath id="plateClip">
      <rect x="6" y="6" width="308" height="84" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- warm glow behind plate -->
  <rect x="6" y="6" width="308" height="84" rx="16" ry="16" fill="none" stroke="#ffb15c" stroke-width="6" opacity="0.55"/>

  <!-- base steel plate -->
  <rect x="6" y="6" width="308" height="84" rx="16" ry="16" fill="url(#metalFill)"/>

  <!-- brushed-metal diagonal streaks -->
  <g clip-path="url(#plateClip)" opacity="0.5">
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.14">
      <line x1="-20" y1="20" x2="340" y2="-10"/>
      <line x1="-20" y1="42" x2="340" y2="12"/>
      <line x1="-20" y1="64" x2="340" y2="34"/>
      <line x1="-20" y1="86" x2="340" y2="56"/>
    </g>
    <g stroke="#000000" stroke-width="1.5" opacity="0.08">
      <line x1="-20" y1="8" x2="340" y2="-22"/>
      <line x1="-20" y1="30" x2="340" y2="0"/>
      <line x1="-20" y1="52" x2="340" y2="22"/>
      <line x1="-20" y1="74" x2="340" y2="44"/>
      <line x1="-20" y1="96" x2="340" y2="66"/>
    </g>
    <!-- ember cracks -->
    <path d="M120,74 L134,62 L146,72 L162,58" fill="none" stroke="#ff8a3d" stroke-width="2" opacity="0.75" stroke-linecap="round"/>
    <path d="M200,26 L212,38 L226,30" fill="none" stroke="#ff8a3d" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- outer dark rim -->
  <rect x="6" y="6" width="308" height="84" rx="16" ry="16" fill="none" stroke="#241c10" stroke-width="4"/>
  <!-- inner highlight bevel -->
  <rect x="11" y="11" width="298" height="74" rx="12" ry="12" fill="none" stroke="#ffe1b0" stroke-width="1.5" opacity="0.6"/>
  <!-- inner shadow bevel -->
  <rect x="13.5" y="13.5" width="293" height="69" rx="10" ry="10" fill="none" stroke="#241c10" stroke-width="1.5" opacity="0.35"/>

  <!-- rivets -->
  <g stroke="#2c1c08" stroke-width="1.2">
    <circle cx="28" cy="24" r="7" fill="url(#rivet)"/>
    <circle cx="292" cy="24" r="7" fill="url(#rivet)"/>
    <circle cx="28" cy="72" r="7" fill="url(#rivet)"/>
    <circle cx="292" cy="72" r="7" fill="url(#rivet)"/>
  </g>
  <g fill="#fff2d0" opacity="0.9">
    <circle cx="26" cy="22" r="1.6"/>
    <circle cx="290" cy="22" r="1.6"/>
    <circle cx="26" cy="70" r="1.6"/>
    <circle cx="290" cy="70" r="1.6"/>
  </g>
</svg>
